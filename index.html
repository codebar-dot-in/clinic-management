<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="MediOS - Modern Healthcare Management Platform for Clinics, Labs, Pharmacies & AYUSH" />
    <title>MediOS — Healthcare Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { 
        font-family: 'Inter', 'Noto Sans Tamil', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Print: hide app shell, show only receipt ── */
      @media print {
        body > #root { display: none !important; }
        #medios-print-area { display: block !important; }
        #medios-print-area * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
      #medios-print-area { display: none; }

      /* ── Loading state ── */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
      }
      #root:empty::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #root:empty {
          background: #0a0f1a;
        }
        #root:empty::after {
          border-color: #1e293b;
          border-top-color: #14b8a6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="medios-print-area"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
